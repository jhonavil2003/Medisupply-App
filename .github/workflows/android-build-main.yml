name: Android Build

on:
  push:
    branches: [ main ]

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties with API Keys
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> local.properties

      - name: Set up Gradle environment
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
          echo "JAVA_HOME is set to: $JAVA_HOME"

      - name: Run Unit Tests
        id: run-tests
        run: |
          echo "Running all unit tests before building APK..."
          ./gradlew test --stacktrace

      - name: Parse Test Results
        if: always()
        run: |
          echo "📊 Parsing test results..."
          
          # Buscar archivos XML de testReleaseUnitTest
          TEST_RESULTS=$(find app/build/test-results/testReleaseUnitTest -name "*.xml" 2>/dev/null || echo "")
          
          if [ -n "$TEST_RESULTS" ]; then
            TOTAL_TESTS=0
            PASSED_TESTS=0
            FAILED_TESTS=0
            SKIPPED_TESTS=0
            
            for file in $TEST_RESULTS; do
              if [ -f "$file" ]; then
                TESTS=$(grep -oP 'tests="\K[0-9]+' "$file" 2>/dev/null || echo "0")
                FAILURES=$(grep -oP 'failures="\K[0-9]+' "$file" 2>/dev/null || echo "0")
                SKIPPED=$(grep -oP 'skipped="\K[0-9]+' "$file" 2>/dev/null || echo "0")
                
                TOTAL_TESTS=$((TOTAL_TESTS + TESTS))
                FAILED_TESTS=$((FAILED_TESTS + FAILURES))
                SKIPPED_TESTS=$((SKIPPED_TESTS + SKIPPED))
              fi
            done
            
            PASSED_TESTS=$((TOTAL_TESTS - FAILED_TESTS - SKIPPED_TESTS))
            
            echo "TOTAL_TESTS=$TOTAL_TESTS" >> $GITHUB_ENV
            echo "PASSED_TESTS=$PASSED_TESTS" >> $GITHUB_ENV
            echo "FAILED_TESTS=$FAILED_TESTS" >> $GITHUB_ENV
            echo "SKIPPED_TESTS=$SKIPPED_TESTS" >> $GITHUB_ENV
            
            echo ""
            echo "📊 Test Results:"
            echo "  • Total: $TOTAL_TESTS"
            echo "  • Passed: $PASSED_TESTS ✅"
            echo "  • Failed: $FAILED_TESTS ❌"
            echo "  • Skipped: $SKIPPED_TESTS ⊘"
          fi

      - name: Build Release APK
        if: success()
        run: |
          echo "Tests passed! Building Release APK with AWS URLs..."
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-main
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-main
          path: app/build/reports/tests/testReleaseUnitTest/

      - name: Build Summary
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo ""
          echo "📦 APK Information:"
          ls -lh app/build/outputs/apk/release/app-release.apk
          echo ""
          echo "🎯 APK available in Artifacts section"
          echo "☁️  Configured with AWS URLs"
